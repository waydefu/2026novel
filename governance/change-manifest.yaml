notes: "Chapter-03, round 2 (continuous re-read with Ch4 as the seam pair). Two independent blind reviewers read Ch3+Ch4 without prior context; findings merged (22 edits). The opening stated the theme and then spoiled the dinner scene's mechanism, so it was compressed to the concrete example plus the wrong belief; the two promised examples (the corridor turn, the cutlery) now appear as a scene at dinner. The servant entered twice through the same doorway with opposite directions, and Roderick vanished from the room without leaving; the same book was called four names and was 'put away' yet still on the table. Three sentences named the emotion or stated the theme after the scene had shown it. Added: the seven-year-old body (the chair, the salt bottle, the cutlery), the maid's apron patch (which Ch2 already gave her), the clock and the carpet, the servant's title length without the title itself, the calendar question written into the notes so it reads as suspended rather than forgotten, the cheat sheet drawn and abandoned - which is the half-drawn paper Ch4 opens on - and the priest's permission ('allowed to look, not to touch') so Ch4's lesson has an authority chain. No event, Knowledge, chapter-end state or Canon change; state_change=none, 11 intentionally untouched."
