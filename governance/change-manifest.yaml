notes: "Revision gate now compares the merge-base with the working tree (staged + unstaged) and counts untracked files as additions. Previously it diffed base...HEAD, so a pre-commit local run saw an empty change set and passed vacuously while CI on the commit failed it. Tools only; no prose, canon, outline or derived-state change."
