name: Sync Draft to Google Doc

on:
  push:
    branches:
      - main
    paths:
      - "10_現行創作資料/小說正文第三版.md"
      - "tools/sync_google_doc.py"
      - "tools/google_apps_script_sync.gs"
      - ".github/workflows/sync-google-doc.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "僅驗證章節切分而不實際推送到 Google 文件"
        required: false
        default: false
        type: boolean

# Queue publication requests; each run refreshes from canonical main before writing.
concurrency:
  group: sync-google-doc-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-google-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Publish the current canonical draft, not the historical commit that
      # happened to trigger this run. A non-draft commit can advance main too.
      - name: Refresh canonical main before publishing
        id: latest
        shell: bash
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing canonical main at $(git rev-parse --short HEAD)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify chapter parsing (dry-run)
        run: python tools/sync_google_doc.py --dry-run

      - name: Push chapters to Google Doc Tabs
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GDOC_WEBHOOK_URL: ${{ secrets.GDOC_WEBHOOK_URL }}
          GDOC_WEBHOOK_SECRET: ${{ secrets.GDOC_WEBHOOK_SECRET }}
          GDOC_ID: "1Qg63ffCy3DlLNpmr1mBz-_yjHDgRBY-QbFxRNI5jOt4"
          SOURCE_SHA: ${{ steps.latest.outputs.sha }}
        run: |
          if [ -z "$GDOC_WEBHOOK_URL" ] || [ -z "$GDOC_WEBHOOK_SECRET" ]; then
            echo "::error title=Google Doc 發布失敗::尚未設定 Webhook URL 或 Secret，無法驗證 Google 文件已更新。"
            exit 1
          fi
          python tools/sync_google_doc.py --mode webhook --strict
